id = "fulanto.oncall"
name = "Oncall"
version = "0.1.2"
min_herdr_version = "0.7.0"
description = "Host control plane for blocked agents. v1 transport: Telegram notify-only."
platforms = ["linux", "macos", "windows"]

[[actions]]
id = "toggle"
title = "Toggle Oncall"
command = ["node", "toggle.mjs"]

[[actions]]
id = "enable"
title = "Enable Oncall"
command = ["node", "toggle.mjs", "on"]

[[actions]]
id = "disable"
title = "Disable Oncall"
command = ["node", "toggle.mjs", "off"]

[[actions]]
id = "test"
title = "Send a test ping"
command = ["node", "test.mjs"]

[[events]]
on = "pane.agent_status_changed"
command = ["node", "notify.mjs"]
