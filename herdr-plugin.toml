id = "com.codreamer.herdr.oncall"
name = "Oncall"
version = "0.1.9"
min_herdr_version = "0.7.0"
description = "Host control plane: Telegram ping on blocked and done."
platforms = ["linux", "macos", "windows"]

[[build]]
command = ["/bin/bash", "run-node.sh", "seed.mjs"]

[[startup]]
command = ["/bin/bash", "run-node.sh", "seed.mjs"]

[[actions]]
id = "setup"
title = "Link Oncall and seed config"
command = ["/bin/bash", "run-node.sh", "install.mjs"]

[[actions]]
id = "toggle"
title = "Toggle Oncall"
command = ["/bin/bash", "run-node.sh", "toggle.mjs"]

[[actions]]
id = "enable"
title = "Enable Oncall"
command = ["/bin/bash", "run-node.sh", "toggle.mjs", "on"]

[[actions]]
id = "disable"
title = "Disable Oncall"
command = ["/bin/bash", "run-node.sh", "toggle.mjs", "off"]

[[actions]]
id = "test"
title = "Send a test ping"
command = ["/bin/bash", "run-node.sh", "test.mjs"]

[[events]]
on = "pane.agent_status_changed"
command = ["/bin/bash", "run-node.sh", "notify.mjs"]
